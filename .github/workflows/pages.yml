name: Deploy BlendParser to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Refresh public app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_releases.py
      - name: Verify release selection
        run: node --test tests/*.test.mjs
      - name: Build static site
        run: python scripts/build.py
      - name: Check page links
        run: python scripts/check_links.py
      - name: Verify translations and repeatable build
        run: python tests/i18n_test.py
      - name: Verify SEO output
        run: python scripts/check_seo.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
